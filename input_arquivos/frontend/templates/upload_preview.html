{% extends "base.html" %}
{% block title %}Visualizar Tabela • Ingestão de Arquivos{% endblock %}

{% block content %}
<div id="preview-root" data-upload-id="{{ upload_id }}" class="flex flex-col gap-4">

    <div class="flex items-center justify-between">
      <a href="/" class="btn btn-ghost btn-sm"><span class="ms" aria-hidden="true">arrow_back</span>Voltar para Envios</a>
    </div>

    <!-- Header Card -->
    <div class="card glass">
      <div class="flex items-center gap-3 mb-1">
        <div class="brand-icon" style="width: 36px; height: 36px;">
          <span class="ms" aria-hidden="true">table_view</span>
        </div>
        <div>
          <p id="preview-filename" class="text-base font-bold" style="color: var(--text);">Carregando…</p>
          <p id="preview-context" class="text-xs" style="color: var(--text-muted);"></p>
        </div>
      </div>
      <p id="preview-truncated-note" class="hidden text-xs text-amber-400 mt-2 p-2 rounded bg-amber-500/10 border border-amber-500/20"></p>
    </div>

    <div id="preview-empty-state" class="hidden card glass text-center p-6">
      <span class="ms" aria-hidden="true" style="font-size:28px;color:var(--text-muted)">info</span>
      <p id="preview-empty-message" class="mt-2 text-xs" style="color: var(--text-muted);"></p>
    </div>

    <!-- Data Table Card -->
    <div id="preview-table-card" class="card glass overflow-x-auto">
      <table class="data-table">
        <thead>
          <tr id="preview-table-head"></tr>
        </thead>
        <tbody id="preview-table-body"></tbody>
      </table>
    </div>

  
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/upload_preview.js?v={{ asset_version }}"></script>
{% endblock %}
