{% extends "base.html" %}
{% block title %}Login • Ingestão de Arquivos{% endblock %}

{% block public %}
<!-- = tela de acesso do app_template: card com mensagens, usuário + senha, alterar senha -->
<div class="overlay login-overlay open">
  <form id="login-form" class="modal glass login-modal" autocomplete="on">
    <div class="login-brand">
      <div class="login-icon"><span class="ms" aria-hidden="true">lock</span></div>
      <img class="brand-logo" src="/static/img/logo-blau.png" alt="Blau Farmacêutica">
      <div>
        <div class="login-title">Ingestão de Arquivos</div>
        <div class="login-sub">Portal de Acesso</div>
      </div>
    </div>
    <div id="login-msg" aria-live="polite"></div>
    <div class="form-group" style="margin-bottom: 1.2rem;">
      <label class="form-label" for="username">Usuário</label>
      <input id="username" name="username" type="text" autocomplete="username" placeholder="Digite seu usuário…" required
        autocapitalize="none" spellcheck="false" class="form-input">
    </div>
    <div class="form-group" style="margin-bottom: 1.2rem;">
      <label class="form-label" for="password">Senha</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha…" required class="form-input">
        <button type="button" class="pw-toggle" data-toggle-pw="password" title="Mostrar/ocultar">SHOW</button>
      </div>
      <p class="form-hint">Sessão com bloqueio por inatividade.</p>
    </div>
    <div class="modal-footer" style="padding-top:.25rem;flex-direction:column;gap:.6rem">
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:.65rem">Entrar / Desbloquear</button>
      <button type="button" class="btn btn-ghost" data-click="change-password"
        style="width:100%;justify-content:center;font-size:.78rem">Alterar Senha</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/login.js?v={{ asset_version }}"></script>
{% endblock %}
