{% extends "base.html" %}
{% block title %}Login • Ingestão de Arquivos{% endblock %}
{% block header %}{% endblock %}

{% block content %}
<div class="login-overlay">
  <div class="modal glass login-modal">
    <div class="login-brand">
      <div class="login-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="login-title">SwordPower</div>
        <div class="login-sub">Ingestão de Arquivos • Acesso</div>
      </div>
    </div>

    <form id="login-form" class="flex flex-col gap-4">
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label" for="username">Usuário</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="Digite seu usuário…" required
          class="form-input">
      </div>

      <div class="form-group" style="margin-bottom:0">
        <label class="form-label" for="password">Senha</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha…" required
            class="form-input">
          <button type="button" class="pw-toggle" onclick="toggleLoginPasswordVis()" title="Mostrar/ocultar">SHOW</button>
        </div>
      </div>

      <p id="error-label" class="text-xs text-negative min-h-[1.25rem]"></p>

      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding: .65rem; margin-top: .25rem;">
        Entrar / Autenticar
      </button>
      
      <button type="button" class="btn btn-ghost" onclick="openSettingsModal()" style="width:100%; justify-content:center; font-size:.78rem;">
        ⚙️ Configurações de Aparência
      </button>
    </form>
    
    <p class="text-xs text-slate-500 mt-4 text-center" style="color: var(--text-subtle);">Ingestão de Arquivos • Excel, CSV, PDF, JSON & Parquet</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/login.js"></script>
<script>
  function toggleLoginPasswordVis() {
    const input = document.getElementById('password');
    const btn = event.currentTarget;
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = 'HIDE';
    } else {
      input.type = 'password';
      btn.textContent = 'SHOW';
    }
  }
</script>
{% endblock %}
