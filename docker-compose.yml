services:
  input-arquivos:
    build: .
    container_name: input-arquivos
    env_file: .env   # inclui CONFIG_ENCRYPTION_KEY (gere com `uv run input-arquivos gerar-chave`)
    environment:
      APP_CONFIG_DB_PATH: /app/data/app_config.db
      # Atrás do Caddy o acesso é sempre HTTPS: o cookie de login só trafega criptografado.
      # Fixo aqui (e não só no .env) para não depender de alguém lembrar de trocar.
      SESSION_COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:8004:8004"   # só local: o acesso pela rede passa pelo Caddy (HTTPS)
    volumes:
      - ./data:/app/data   # SQLite e chave de sessão (e a chave de cifra, só se CONFIG_ENCRYPTION_KEY estiver vazia)
    restart: unless-stopped

  # Proxy reverso HTTPS em https://input.blau.com (SITE_ADDRESS no .env), com o
  # certificado da Blau em ./certs (ver Caddyfile).
  caddy:
    image: caddy:2
    container_name: input-arquivos-caddy
    depends_on:
      - input-arquivos
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
